<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="maroonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6B1D27"/>
      <stop offset="100%" stop-color="#420E15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F3DC87"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#AA8214"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#1F0407" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Base Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#maroonGrad)" stroke="url(#goldGrad)" stroke-width="2"/>

  <!-- Stylized Open Book Symbol -->
  <g filter="url(#subtleShadow)">
    <!-- Book Spine Glow / Shadow -->
    <path d="M32 46 V24" stroke="#2B070D" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Pages -->
    <path d="M32 23 C27 20 18 20 13 22 C12 22.4 11.5 23.2 11.5 24.2 V43.5 C11.5 44.4 12.3 45 13.2 44.8 C17.8 43.5 26.5 43.5 32 46.5 Z" 
          fill="#FFFDF7" stroke="#EADBBD" stroke-width="0.75"/>

    <!-- Right Pages -->
    <path d="M32 23 C37 20 46 20 51 22 C52 22.4 52.5 23.2 52.5 24.2 V43.5 C52.5 44.4 51.7 45 50.8 44.8 C46.2 43.5 37.5 43.5 32 46.5 Z" 
          fill="#FFF9EE" stroke="#EADBBD" stroke-width="0.75"/>

    <!-- Left Inner Page Lines -->
    <path d="M16 28 C21 26.5 27 27 30 28.5" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M16 33 C21 31.5 27 32 30 33.5" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M16 38 C21 36.5 27 37 30 38.5" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Right Inner Page Lines -->
    <path d="M34 28.5 C37 27 43 26.5 48 28" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M34 33.5 C37 32 43 31.5 48 33" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <path d="M34 38.5 C37 37 43 36.5 48 38" stroke="#9E323F" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>

    <!-- Center Gold Bookmark Ribbon -->
    <path d="M32 21 V35 L34 33 L36 35 V21 Z" fill="url(#goldGrad)"/>

    <!-- Gold Star of Excellence -->
    <path d="M32 10 L33.2 13.5 L36.8 13.5 L33.9 15.6 L35 19 L32 16.8 L29 19 L30.1 15.6 L27.2 13.5 L30.8 13.5 Z" fill="url(#goldGrad)"/>
  </g>
</svg>
